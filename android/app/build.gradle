// The Android app is only a shell: one screen that shows the game from web/,
// and a check at launch that downloads a newer web/ from the latest release.
// There is no copy of the game code here, so the page and the app cannot drift.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ashport.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ashport.game'
        minSdk 26
        targetSdk 34
        // Set by the GitHub workflow so that each build installs over the last.
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('VERSION_NAME') ?: 'dev')
        // Where the app looks for newer versions of the game.
        buildConfigField 'String', 'UPDATE_REPO', '"imulision/Project_A"'
    }

    // One fixed key for every build. Android refuses to update an app whose
    // key changed, and a new key per build is what GitHub would give us.
    // This key is for the prototype only and must not be used for a store.
    signingConfigs {
        prototype {
            storeFile file('../prototype.keystore')
            storePassword 'android'
            keyAlias 'ashport'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.prototype
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
