name: Android APK

# Builds the Android app from web/ on every pull request, to prove it still
# builds. On every push to main it also publishes the APK as a release, which
# is what the phone installs and updates from.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Check that every file of the game is inside the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ashport.apk
          unzip -l ashport.apk > contents.txt
          for f in web/*; do
            grep -q " assets/$(basename "$f")\$" contents.txt || { echo "missing from the APK: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ashport-apk
          path: ashport.apk
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$VERSION_NAME" ashport.apk
          --target "$GITHUB_SHA"
          --title "Ashport $VERSION_NAME"
          --notes "Built from $GITHUB_SHA."
