<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Ashport</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<link href="./style.css" rel="stylesheet"></head><body>
<div id="load">ASHPORT</div>
<div id="labels"></div>
<div class="top">
  <h1 id="date">January 1926</h1>
  <div class="sub"><span id="sub">Name your first capo to begin</span><span id="fps"></span></div>
  <div class="res">
    <div data-tip="Dirty cash: what your capos send up from the streets. It pays for moving into a district, men and most places. It cannot buy what must look honest."><small><span data-ic="dirty"></span>DIRTY <i id="dirty-in"></i></small><b id="dirty">$0</b></div>
    <div data-tip="Clean cash: money your capos washed in their laundries and fronts before sending your share. It buys fronts and warehouses, and the police cannot seize it."><small><span data-ic="clean"></span>CLEAN <i id="clean-in"></i></small><b id="clean">$0</b></div>
    <div data-tip="Districts your family holds, out of all the districts of the six cities."><small><span data-ic="streets"></span>DISTRICTS</small><b id="held">0</b></div>
    <div data-tip="Men you named yourself. You can never name more than nine: beyond that, your underbosses choose."><small><span data-ic="men"></span>YOUR MEN</small><b id="named">0 / 9</b></div>
  </div>
  <div id="alerts"></div>
</div>
<div id="toast"></div>
<div id="tip"></div>
<div class="bot">
  <button id="map">Map</button><button id="pause">Pause</button><button id="speed">1x</button><button id="money">$</button>
  <span class="grow"></span>
  <button id="family">Family</button><button id="journal">Journal</button>
</div>
<div id="veil"><div id="sheet"></div></div>
<script src="./district.js"></script>
<script src="./world.js"></script>
<script src="./game.js"></script>
<script src="./mapview.js"></script>
<script src="./render.js"></script>
<script src="./icons.js"></script>
<script src="./sheets.js"></script>
<script src="./ui.js"></script>
</body></html>
