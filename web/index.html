<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Ashport</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<link href="./style.css" rel="stylesheet"></head><body>
<div id="load"><b>ASHPORT</b><div class="bar"><i id="load-bar"></i></div><small id="load-what">Starting</small></div>
<script>
// The wait before the game: every file read and every stage of building the map moves the bar. If something breaks, it says so instead of waiting forever.
window.AshportLoad = (function () {
  var FILES = 18, STAGES = ['Street furniture', 'Land', 'City blocks', 'Lights', 'First picture'], total = FILES + STAGES.length, steps = [], files = 0, t0 = Date.now();
  function show(label) { var part = Math.min(1, (steps.length + 1) / total); steps.push({ label: label, part: part, ms: Date.now() - t0 });
    var b = document.getElementById('load-bar'), w = document.getElementById('load-what'); if (b) b.style.width = Math.round(part * 100) + '%'; if (w) w.textContent = label + ' · ' + Math.round(part * 100) + '%'; }
  function fail(why) { var l = document.getElementById('load'); if (!l) return; l.classList.add('bad');
    document.getElementById('load-what').innerHTML = 'Could not start: ' + String(why).replace(/[<&]/g, ' ') + '<br><button onclick="location.reload()">Try again</button>'; }
  window.addEventListener('error', function (e) { fail(e.message || 'a file did not load'); }, true);
  window.addEventListener('unhandledrejection', function (e) { fail(e.reason && e.reason.message || e.reason); });
  return { steps: steps, file: function () { show('Files ' + (++files) + ' / ' + FILES); }, stage: function (n) { show(STAGES[n]); }, fail: fail };
})();
</script>
<div id="labels"></div>
<div class="top">
  <h1 id="date">Ashport</h1>
  <div class="sub"><span id="sub">Pick your first capo to begin</span><span id="heat" data-tip="Heat: how closely the police watch your hottest city. Too much brings busts."></span><span id="fps"></span></div>
  <div id="rank"></div>
  <div id="stall"></div>
  <div class="res">
    <div class="acct dirty" data-account="dirty"><small><span data-ic="dirty"></span>DIRTY CASH</small><b id="dirty">$0</b><em id="wash"></em></div>
    <div class="acct clean" data-account="clean"><small><span data-ic="clean"></span>CLEAN MONEY</small><b id="clean">$0</b><em id="kept"></em></div>
    <div class="slim" data-tip="Streets your family holds, out of all the streets of the six cities, and the cities where you have a man."><small><span data-ic="streets"></span>STREETS <i id="cities"></i></small><b id="share">0%</b><em id="shared"></em></div>
    <div class="slim" data-tip="Your capos, out of the seats your cities can carry. Each key place you hold adds a seat in its city."><small><span data-ic="men"></span>CAPOS</small><b id="men">0 / 0</b></div>
  </div>
  <div id="next"></div>
  <div id="clock"></div>
  <div id="alerts"></div>
  <div id="feed"></div>
</div>
<div id="hint"></div>
<div id="toast"></div>
<div id="moment"></div>
<div id="tip"></div>
<div class="bot">
  <button id="map">Map</button><button id="pause">Pause</button><button id="speed">1x</button>
  <span class="grow"></span>
  <button id="family">Family</button><button id="journal">Journal</button>
</div>
<div id="veil"><div id="sheet"></div></div>
