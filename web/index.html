<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashport 1926: gameplay prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#14241E;--ink:#1F1A15;--paper:#EDE0C4;--dim:#D9C9A6;--gold:#E2BE6A;--line:#5C7268;--red:#B5281C;--good:#A9D0B6;--bad:#FF9C8A}
*{box-sizing:border-box}
html,body{margin:0;background:#0C1612;color:var(--paper);font-family:'Special Elite','Courier New',monospace}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{max-width:430px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px}
.title{font-family:'Limelight',serif;font-size:22px;line-height:1;color:var(--gold)}
.date{font-size:13px;color:var(--dim);margin-top:3px}
.speed{display:flex;gap:4px}
.speed button{width:44px;height:44px;border:1px solid var(--paper);font-size:15px}
.speed button[aria-pressed=true]{background:var(--paper);color:var(--bg)}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 12px 6px}
.res div{border:1px solid var(--line);padding:6px 6px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.res .l{font-size:12px;color:var(--dim)}
.res .v{font-size:17px;white-space:nowrap}
.res .t{font-size:12px;white-space:nowrap}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--dim)}
.share{padding:0 12px 6px;font-size:12px}
.bar{display:flex;height:10px}
.bar i{display:block;height:10px;transition:width .6s}
.legend{display:flex;justify-content:space-between;margin-top:3px}
.mapwrap{position:relative;line-height:0}
#map{display:block;width:100%;height:auto;background:#7FA3A8}
.tag{position:absolute;transform:translate(-50%,-50%);line-height:1.15;text-align:center;min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 4px}
.tag .n{font-family:'Limelight',serif;font-size:13px;color:var(--ink);text-shadow:-1.5px 0 #F7EFD9,1.5px 0 #F7EFD9,0 -1.5px #F7EFD9,0 1.5px #F7EFD9,1px 1px #F7EFD9,-1px -1px #F7EFD9,1px -1px #F7EFD9,-1px 1px #F7EFD9}
.tag .who{font-size:12px;background:var(--ink);color:#FFF6E4;padding:3px 6px 1px;margin-top:2px;white-space:nowrap;border:1.5px solid #F7EFD9}
.tag .who.vac{background:var(--red);animation:pulse 1.2s infinite}
.tag .who.riv{background:#4A3D2C}
@keyframes pulse{50%{opacity:.55}}
.toast{position:absolute;left:8px;right:8px;top:8px;background:var(--ink);border:1.5px solid var(--gold);color:#FFF6E4;font-size:13px;line-height:1.3;padding:8px 10px 6px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.toast b{font-family:'Limelight',serif;font-weight:400;color:var(--gold)}
.prog{height:6px;background:#0C1612}
.prog i{display:block;height:6px;background:var(--gold);width:0}
.log{padding:8px 12px 14px;font-size:13px;line-height:1.35;display:flex;flex-direction:column;gap:4px;min-height:92px}
.log div{display:flex;gap:8px}
.log .m{color:var(--dim);flex-shrink:0;width:34px}
.hint{font-size:12px;color:var(--dim);padding:0 12px 12px}
#veil{position:fixed;inset:0;background:rgba(8,14,12,.6);display:none;align-items:flex-end;justify-content:center;z-index:5}
#veil.on{display:flex}
#sheet{width:100%;max-width:430px;max-height:88vh;overflow:auto;background:#E3D3B0;color:var(--ink);border-top:5px solid #1F342D;padding:14px 12px 16px;line-height:1.35}
#sheet h2{font-family:'Limelight',serif;font-weight:400;font-size:21px;margin:0 0 4px;line-height:1.15}
#sheet p{margin:0 0 10px;font-size:14px}
.card{border:1.5px solid var(--ink);background:#F4E9CF;padding:10px 10px 8px;margin-bottom:8px;display:block;width:100%;text-align:left}
.card .nm{font-family:'Limelight',serif;font-size:17px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0;font-size:12.5px}
.tags span{padding:3px 6px 1px;border:1.5px solid var(--ink)}
.q{background:#CFE3D2}.f{background:#F2C9BF}
.plan{font-size:13.5px;font-style:italic;margin:4px 0}
.fx{font-size:12.5px;color:#4A3D2C}
.go{display:block;width:100%;min-height:48px;background:var(--red);color:#FFF6E4;font-size:15px;padding:10px 12px 7px;margin-top:8px;text-align:center}
.alt{display:block;width:100%;min-height:48px;border:1.5px solid var(--ink);font-size:15px;padding:10px 12px 7px;margin-top:8px;text-align:center}
.pick{margin-top:6px;background:var(--red);color:#FFF6E4;padding:8px 10px 5px;font-size:14px;display:inline-block}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0;font-size:13px}
.stat div{border:1.5px solid var(--ink);padding:6px 8px 4px;background:#F4E9CF}
.stat b{display:block;font-weight:400;font-size:17px}
.meter{height:8px;background:#CDBB92;border:1px solid var(--ink);margin-top:3px}
.meter i{display:block;height:100%;background:#1F342D}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div><div class="title">Ashport</div><div class="date" id="date">January 1926</div></div>
    <div class="speed" role="group" aria-label="Game speed">
      <button type="button" data-speed="0" aria-label="Pause">II</button>
      <button type="button" data-speed="1" aria-label="Normal speed">x1</button>
      <button type="button" data-speed="3" aria-label="Fast">x3</button>
    </div>
  </div>
  <div class="res" id="res"></div>
  <div class="share"><div class="bar" id="bar"></div><div class="legend" id="legend"></div></div>
  <div class="mapwrap" id="mapwrap">
    <svg id="map" viewBox="0 0 390 470" role="img" aria-label="Isometric map of Ashport. Roof colours show who holds each building and building height shows how developed a district is."></svg>
    <div id="tags"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <div class="prog" aria-hidden="true"><i id="prog"></i></div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="hint">Tap a district to see it or to change who runs it. You never act yourself: you only choose people.</div>
</div>
<div id="veil"><div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"></div></div>

<script>
(function(){
'use strict';
var INK='#1F1A15',GOLD='#F2C14E',PAPER='#F7EFD9';
var ROOF={you:['#5E8F6E','#6F9A7F'],cal:['#B5604F','#C97464'],north:['#6A8DB3','#7C9FC2'],free:['#CDBF9C','#D8CBA9']};
var WL=['#7A6C55','#8E7F63','#A39270'],WR=['#95866C','#B3A282','#D2C19A'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var SHORE=46,SHY=-40+SHORE*10;
function $(id){return document.getElementById(id)}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function P(i,j){return [195+(i-j)*20,-40+(i+j)*10]}
function zone(i,j){
  if(i===12||i===13)return null;
  if(i<12){if(j<=7)return 'uptown';if(j<=12)return 'hillside';return 'market'}
  if(i>=22&&j<=19)return 'canal';
  if(j<=12)return 'stock';
  if(j<=17)return 'union';
  return 'docks';
}
var SEED={hillside:[11,12],market:[11,14],union:[15,17],docks:[16,20],canal:[22,19]};
var TILES=[];
(function(){
  var R=rng(11),i,j,z,p,t,mx={};
  for(i=0;i<40;i++)for(j=0;j<40;j++){
    if(Math.abs(i-j)>11||i+j<2||i+j>=SHORE)continue;
    z=zone(i,j);if(!z)continue;
    if(i%4===0||j%4===0)continue;
    p=P(i,j);
    t={cx:p[0],cy:p[1]+10,d:z,r:R(),hf:R(),a:[12,14,14,15][Math.floor(R()*4)],c:R()<.5?0:1,w:[],k:i+j,i:i,dist:0};
    for(var q=0;q<16;q++)t.w.push(R());
    if(SEED[z]){t.dist=Math.sqrt(Math.pow(i-SEED[z][0],2)+Math.pow(j-SEED[z][1],2));mx[z]=Math.max(mx[z]||0,t.dist)}
    TILES.push(t);
  }
  TILES.forEach(function(t){t.thr=SEED[t.d]?Math.min(.999,.72*t.dist/mx[t.d]+.28*t.r):t.r});
  TILES.sort(function(a,b){return a.k-b.k||a.i-b.i});
})();

var LTS={
 sal:{name:'Sal',quality:'Iron fist',flaw:'Hot-headed',plan:'Give me the street. I take every block by spring, and everyone will know it.',exp:9,build:.04,earn:1,heat:5,skim:0,cost:0,loy:65},
 rosa:{name:'Rosa',quality:'Charmer',flaw:'Big spender',plan:'I open clubs. People come to us and nobody gets hurt. It costs money.',exp:4,build:.11,earn:1.1,heat:0,skim:0,cost:180,loy:70},
 frankie:{name:'Frankie',quality:'Smuggler',flaw:'Skims the take',plan:'More boats, more whisky. Do not count the crates too closely.',exp:2,build:.05,earn:1.5,heat:1,skim:.25,cost:0,loy:55},
 vito:{name:'Vito',quality:'Loyal',flaw:'Slow',plan:'I hold what we have. No surprises, boss.',exp:3,build:.04,earn:1,heat:0,skim:0,cost:0,loy:90},
 mae:{name:'Mae',quality:'Bookkeeper',flaw:'Timid',plan:'I make it pay and I keep it quiet. I do not pick fights.',exp:0,build:.06,earn:1.4,heat:-2,skim:0,cost:0,loy:70},
 dutch:{name:'Dutch',quality:'Enforcer',flaw:'Ambitious',plan:'Point me at Callahan. Then we talk about my cut.',exp:12,build:.03,earn:1,heat:6,skim:0,cost:0,loy:45,amb:true},
 nora:{name:'Nora',quality:'Fixer',flaw:'Greedy',plan:'I pay the right people. The law looks elsewhere.',exp:2,build:.05,earn:1,heat:-5,skim:0,cost:250,loy:60}
};
var S;
function init(){
  S={m:0,tick:0,speed:1,paused:false,over:false,cash:1500,men:34,idle:6,heat:40,respect:30,
     d:{cash:0,heat:0,respect:0},log:[],done:{},bench:['sal','vito','mae'],
     D:{
      uptown:{name:'Uptown',base:'north',pos:[272,92],rivalName:'Northside'},
      hillside:{name:'Hillside',base:'free',play:true,share:35,level:1,lt:null,inc:170,rival:0,pos:[150,168],boost:0,last:0},
      market:{name:'Market Street',base:'free',play:true,share:60,level:1.6,lt:'rosa',inc:280,rival:0,pos:[64,268],boost:0,last:0},
      stock:{name:'Stockyards',base:'cal',pos:[342,236],rivalName:'Callahan'},
      union:{name:'Union Station',base:'free',play:true,share:8,level:1,lt:null,inc:250,rival:.25,pos:[258,300],boost:0,last:0},
      docks:{name:'The Docks',base:'free',play:true,share:85,level:2,lt:'frankie',inc:330,rival:0,pos:[186,396],boost:0,last:0},
      canal:{name:'Canal Street',base:'free',play:true,share:0,level:1,lt:null,inc:220,rival:.3,pos:[336,392],boost:0,last:0}
     },
     L:JSON.parse(JSON.stringify(LTS))};
  S.prevBlocks=blocks().you;
  say('The family holds the Docks and most of Market Street.');
  drawStatic();render();hud();
  $('veil').className='';
  setTimeout(function(){askAssign('hillside','Hillside has no lieutenant','Three people want the job. Whoever you pick will run the district their own way.',false)},700);
}
function owner(t){
  var d=S.D[t.d];
  if(!d.play)return d.base;
  if(t.thr<d.share/100)return 'you';
  if(d.rival&&t.thr>1-d.rival)return 'cal';
  return 'free';
}
function blocks(){var c={you:0,cal:0,north:0,free:0};TILES.forEach(function(t){c[owner(t)]++});return c}
function f(n){return (Math.round(n*10)/10)}
function drawStatic(){
  var s='',k,teeth='M0 '+SHY;
  for(k=0;k<11;k++)teeth+=' L'+(k*40+15)+' '+(SHY+10)+' L'+(k*40+35)+' '+SHY;
  s+='<rect x="0" y="0" width="390" height="'+SHY+'" fill="#C2B48F"/><path d="'+teeth+' L390 0 L0 0 Z" fill="#C2B48F"/><path d="'+teeth+'" fill="none" stroke="'+INK+'" stroke-width="2"/>';
  function pp(a){return a.map(function(p){return f(p[0])+','+f(p[1])}).join(' ')}
  s+='<polygon points="'+pp([P(12,0),P(14,0),P(14,40),P(12,40)])+'" fill="#7FA3A8" stroke="'+INK+'" stroke-width="1.5"/>';
  [8,16,20,24,28].forEach(function(j){s+='<polygon points="'+pp([P(12,j+.2),P(14,j+.2),P(14,j+.8),P(12,j+.8)])+'" fill="'+PAPER+'" stroke="'+INK+'" stroke-width="1.2"/>'});
  s+='<g stroke="#8A7550" stroke-width="5" stroke-linecap="round"><path d="M120 '+(SHY+8)+' l0 30 M170 '+(SHY+8)+' l0 34 M220 '+(SHY+8)+' l0 30"/></g>';
  s+='<g id="bld" stroke="'+INK+'" stroke-width="0.9" stroke-linejoin="round"></g>';
  function road(a,b){return 'M'+f(a[0])+' '+f(a[1])+' L'+f(b[0])+' '+f(b[1])}
  function truck(path,dur,beg,col){return '<g><rect x="-7" y="-4" width="14" height="7" rx="1.5" fill="'+col+'" stroke="'+PAPER+'" stroke-width="0.8"/><rect x="3" y="-3" width="4" height="5" fill="'+GOLD+'"/><animateMotion path="'+path+'" dur="'+dur+'s" begin="'+beg+'s" repeatCount="indefinite" rotate="auto"/></g>'}
  var r1=road(P(14,16.5),P(29,16.5)),r2=road(P(20.5,25),P(20.5,10)),r3=road(P(11.5,24.5),P(22,24.5));
  s+=truck(r1,9,0,'#3F6B50')+truck(r1,9,-4.5,'#3F6B50')+truck(r2,8,0,INK)+truck(r2,8,-4,INK)+truck(r3,10,-2,'#3F6B50');
  s+='<g fill="'+INK+'"><g><path d="M-13 -5 L7 -5 L14 0 L7 5 L-13 5 Z"/><animateMotion path="M410 '+(SHY+40)+' C300 '+(SHY+46)+' 240 '+(SHY+40)+' 190 '+(SHY+34)+'" dur="10s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"/></g></g>';
  $('map').innerHTML=s;
}
function render(){
  var s='',i,t,o,lvl,h,a,b,cx,cy,li,d,y,k,lit,wd;
  for(i=0;i<TILES.length;i++){
    t=TILES[i];o=owner(t);d=S.D[t.d];cx=t.cx;cy=t.cy;
    s+='<polygon stroke="none" fill="#EFE4C8" points="'+cx+','+(cy-9)+' '+(cx+18)+','+cy+' '+cx+','+(cy+9)+' '+(cx-18)+','+cy+'"/>';
    if(o==='free'&&t.hf<.12)continue;
    lvl=o==='you'?d.level:(o==='free'?1:2);
    h=f(7+t.hf*8+(lvl-1)*(9+t.hf*17));a=t.a;b=a/2;li=Math.max(0,Math.min(2,Math.round(lvl)-1));
    s+='<polygon fill="'+WL[li]+'" points="'+(cx-a)+','+cy+' '+cx+','+(cy+b)+' '+cx+','+f(cy+b-h)+' '+(cx-a)+','+f(cy-h)+'"/>';
    s+='<polygon fill="'+WR[li]+'" points="'+cx+','+(cy+b)+' '+(cx+a)+','+cy+' '+(cx+a)+','+f(cy-h)+' '+cx+','+f(cy+b-h)+'"/>';
    s+='<polygon fill="'+ROOF[o][t.c]+'" points="'+cx+','+f(cy-b-h)+' '+(cx+a)+','+f(cy-h)+' '+cx+','+f(cy+b-h)+' '+(cx-a)+','+f(cy-h)+'"/>';
    if(h>=15){
      lit=o==='you'?(.15+.38*(lvl-1)):.4;wd='';k=0;
      for(y=6;y<h-4;y+=8){
        if(t.w[k++%16]<lit)wd+='M'+f(cx-a+2.5)+' '+f(cy-y+1.2)+'L'+f(cx-2)+' '+f(cy+b-y-1);
        if(t.w[k++%16]<lit)wd+='M'+f(cx+2)+' '+f(cy+b-y-1)+'L'+f(cx+a-2.5)+' '+f(cy-y+1.2);
      }
      if(wd)s+='<path d="'+wd+'" fill="none" stroke="'+GOLD+'" stroke-width="2.2" stroke-dasharray="2.5 2.5"/>';
    }
  }
  $('bld').innerHTML=s;
  var h2='';
  Object.keys(S.D).forEach(function(id){
    var d=S.D[id],who;
    if(!d.play)who='<span class="who riv">'+d.rivalName+'</span>';
    else if(d.lt)who='<span class="who">'+S.L[d.lt].name+'</span>';
    else who='<span class="who vac">Vacant</span>';
    var st='left:'+(d.pos[0]/390*100)+'%;top:'+(d.pos[1]/470*100)+'%';
    if(d.play)h2+='<button type="button" class="tag" style="'+st+'" data-dist="'+id+'"><span class="n">'+d.name+'</span>'+who+'</button>';
    else h2+='<div class="tag" style="'+st+'"><span class="n">'+d.name+'</span>'+who+'</div>';
  });
  $('tags').innerHTML=h2;
}
function money(n){return (n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US')}
function trend(v,unit,goodUp){
  if(!v)return '<span class="t flat">steady</span>';
  var good=goodUp?v>0:v<0;
  return '<span class="t '+(good?'up':'down')+'">'+(v>0?'+':'-')+(unit==='$'?'$'+Math.abs(Math.round(v)).toLocaleString('en-US'):Math.abs(Math.round(v)))+'/mo</span>';
}
function hud(){
  $('date').textContent=MONTHS[S.m%12]+' '+(1926+Math.floor(S.m/12));
  $('res').innerHTML=
   '<div><span class="l">Cash</span><span class="v">'+money(S.cash)+'</span>'+trend(S.d.cash,'$',true)+'</div>'+
   '<div><span class="l">Men</span><span class="v">'+S.men+'</span><span class="t flat">'+S.idle+' idle</span></div>'+
   '<div><span class="l">Heat</span><span class="v" style="color:'+(S.heat>=70?'#FF9C8A':'inherit')+'">'+Math.round(S.heat)+'</span>'+trend(S.d.heat,'',false)+'</div>'+
   '<div><span class="l">Respect</span><span class="v">'+Math.round(S.respect)+'</span>'+trend(S.d.respect,'',true)+'</div>';
  var c=blocks(),n=c.you+c.cal+c.north+c.free,p=function(k){return Math.round(c[k]/n*100)};
  $('bar').innerHTML='<i style="width:'+p('you')+'%;background:#6F9A7F"></i><i style="width:'+p('cal')+'%;background:#C97464"></i><i style="width:'+p('north')+'%;background:#7C9FC2"></i><i style="flex-grow:1;background:#DCCFAE"></i>';
  $('legend').innerHTML='<span style="color:#A9D0B6">You '+p('you')+'%</span><span style="color:#FF9C8A">Callahan '+p('cal')+'%</span><span style="color:#A9C6E3">Northside '+p('north')+'%</span><span>Free '+(100-p('you')-p('cal')-p('north'))+'%</span>';
  $('prog').style.width=(S.tick/4*100)+'%';
  $('log').innerHTML=S.log.slice(0,3).map(function(l){return '<div><span class="m">'+l[0]+'</span><span>'+l[1]+'</span></div>'}).join('');
  var bs=document.querySelectorAll('[data-speed]'),i;
  for(i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',String(Number(bs[i].getAttribute('data-speed'))===S.speed));
}
function say(t){S.log.unshift([MONTHS[S.m%12].slice(0,3),t])}
var toastT;
function toast(html){var e=$('toast');e.innerHTML=html;e.className='toast on';clearTimeout(toastT);toastT=setTimeout(function(){e.className='toast'},3200)}
function playable(){return Object.keys(S.D).filter(function(k){return S.D[k].play})}

function step(){
  if(S.paused||S.over||S.speed===0)return;
  playable().forEach(function(id){
    var d=S.D[id],l=d.lt&&S.L[d.lt],before=Math.floor(d.level+1e-6);
    if(l){
      var e=l.exp*(d.boost>0?1.6:1)/4;
      d.share=Math.min(100,d.share+e);
      d.level=Math.min(3,d.level+l.build/4*(.4+.6*d.share/100)*2.2);
      if(d.rival)d.rival=Math.max(0,Math.min(d.rival,1-d.share/100)-(l.exp>=9?.012:0));
    }else{
      d.share=Math.max(0,d.share-.5);
      if(id==='union'||id==='canal')d.rival=Math.min(.85,(d.rival||0)+.012);
      d.rival=Math.min(d.rival,1-d.share/100);
    }
    if(Math.floor(d.level+1e-6)>before){S.respect+=3;say(d.name+' reached level '+['I','II','III'][Math.floor(d.level+1e-6)-1]+'. The street looks different now.');toast('<b>'+d.name+'</b> is now a level '+['I','II','III'][Math.floor(d.level+1e-6)-1]+' district.')}
  });
  S.tick++;
  if(S.tick>=4){S.tick=0;monthEnd()}
  render();hud();
}
function incomeOf(d){var l=d.lt&&S.L[d.lt];return d.inc*d.share/100*(.6+.4*d.level)*(l?l.earn:.5)}
function monthEnd(){
  var gross=0,skim=0,cost=0,heat=-2,parts=[],c0={cash:S.cash,heat:S.heat,respect:S.respect};
  playable().forEach(function(id){
    var d=S.D[id],l=d.lt&&S.L[d.lt],g=incomeOf(d),sk=l?g*l.skim:0;
    d.last=g-sk;gross+=g;skim+=sk;
    if(d.boost>0)d.boost--;
    if(l){cost+=l.cost;heat+=l.heat;l.loy=Math.min(100,l.loy+1);if(l.amb)l.loy-=3}
    if(g-sk>40)parts.push(d.name+' '+money(g-sk));
  });
  S.bench.forEach(function(k){S.L[k].loy=Math.max(0,S.L[k].loy-1)});
  var wages=S.men*15,net=gross-skim-cost-wages;
  S.cash+=net;S.heat=Math.max(0,Math.min(100,S.heat+heat));
  var b=blocks().you;if(b>S.prevBlocks+2)S.respect+=1;else if(b<S.prevBlocks-2)S.respect-=2;S.prevBlocks=b;
  S.respect=Math.max(0,Math.min(100,S.respect));
  S.d={cash:S.cash-c0.cash,heat:S.heat-c0.heat,respect:S.respect-c0.respect};
  toast('<b>The envelope</b> '+money(gross-skim)+' came up. Wages and costs '+money(wages+cost)+'. Net '+(net>=0?'+':'')+money(net)+'.<br>'+parts.join(', '));
  S.m++;
  if(S.heat>=100)return end('Federal raid','Heat reached 100. Agents hit every address in one night, and one of your men talked.',false);
  if(S.cash<-1500)return end('Broke','The men have not been paid in weeks. They walk away, and the Callahans hire them.',false);
  events();
}
function lowest(){var w=null;playable().forEach(function(id){var k=S.D[id].lt;if(k&&(!w||S.L[k].loy<S.L[w].loy))w=k});return w}
function distOf(k){var r=null;playable().forEach(function(id){if(S.D[id].lt===k)r=id});return r}
function events(){
  var m=S.m,d,k;
  if(m===2&&S.D.hillside.lt){k=S.D.hillside.lt;
    return ask(S.L[k].name+' asks for five men','"Hillside is slow going. Give me five of the idle men and I double the pace for three months."',[
      ['Give five men','Men idle -5. Faster in Hillside for 3 months. '+S.L[k].name+' is grateful.',function(){S.idle=Math.max(0,S.idle-5);S.D.hillside.boost=3;S.L[k].loy+=10;say(S.L[k].name+' got his five men for Hillside.')}],
      ['Refuse','Nothing changes on the map. '+S.L[k].name+' takes it personally.',function(){S.L[k].loy-=15;say('You refused '+S.L[k].name+' the men he asked for.')}]]);
  }
  if(m===3){S.bench.push('dutch','nora');say('Two new faces in town: Dutch and Nora want in.');
    return askAssign('union','Union Station is up for grabs','The rail yard moves everything in this city. The Callahans are already circling it.',true);}
  if(m===5&&!S.D.canal.lt&&S.bench.length){
    return askAssign('canal','Callahan men are moving into Canal Street','Red roofs are spreading along the canal. Send someone, or let them have it.',true,function(){S.respect-=4;say('You let Canal Street go. People noticed.')});}
  if(m===6&&distOf('frankie')){
    return ask("Frankie's envelope is thin",'Your bookkeeping says a quarter of the Docks money never reaches you. Frankie smiles and says the lake was rough.',[
      ['Make an example','Frankie stops skimming. His loyalty drops hard. Respect +3.',function(){S.L.frankie.skim=0;S.L.frankie.loy-=25;S.respect+=3;say('Frankie was reminded whose money it is.')}],
      ['Look away','He keeps skimming. He likes you for it. Respect -3.',function(){S.L.frankie.loy+=8;S.respect-=3;say('You let Frankie keep his cut.')}]]);
  }
  if(m===8&&S.heat>=55){
    return ask('The police captain names his price','"Eight hundred dollars and my boys find other streets to walk." Heat is at '+Math.round(S.heat)+'.',[
      ['Pay $800','Cash -$800. Heat -25.',function(){S.cash-=800;S.heat=Math.max(0,S.heat-25);say('The captain was paid. The patrols thinned out.')}],
      ['Refuse','Heat +8. He will remember.',function(){S.heat=Math.min(100,S.heat+8);say('You sent the captain away empty-handed.')}]]);
  }
  if(m===10){k=lowest();
    if(k&&S.L[k].loy<45){d=S.D[distOf(k)];
      var nm=S.L[k].name;d.lt=null;d.share=Math.min(d.share,12);d.rival=.7;d.level=Math.max(1,d.level-.8);S.respect-=6;
      say(nm+' went over to the Callahans and took '+d.name+' with him.');
      return ask(nm+' has betrayed you',nm+"'s loyalty had been falling for months. Last night his men opened "+d.name+' to the Callahans. The roofs are turning red.',[
        ['Understood','You can send someone to take it back.',function(){}]]);
    }
    say('Your lieutenants are holding the line. Nobody is for sale this month.');
  }
  if(m>=12){var c=blocks(),p=Math.round(c.you/(c.you+c.cal+c.north+c.free)*100);
    return end(p>=55?'Ashport answers to you':p>=38?'A family to reckon with':'Still a small-time outfit','End of 1926. You hold '+p+'% of the city, with '+money(S.cash)+' in the safe, heat at '+Math.round(S.heat)+' and respect at '+Math.round(S.respect)+'.',true);}
}
function open(html){S.paused=true;$('sheet').innerHTML=html;$('veil').className='on';$('sheet').scrollTop=0;var b=$('sheet').querySelector('button');if(b)b.focus()}
function close(){$('veil').className='';S.paused=false;render();hud()}
var handlers=[];
function ask(title,text,opts){
  handlers=opts.map(function(o){return o[2]});
  open('<h2 id="sh">'+title+'</h2><p>'+text+'</p>'+opts.map(function(o,i){return '<button type="button" class="card" data-opt="'+i+'"><span class="nm">'+o[0]+'</span><div class="fx">'+o[1]+'</div></button>'}).join(''));
}
function fx(l){
  var a=[];
  a.push(l.exp>=8?'Takes blocks fast':l.exp>=4?'Takes blocks steadily':l.exp>0?'Takes blocks slowly':'Does not expand');
  a.push(l.build>=.09?'builds fast':l.build>=.05?'builds steadily':'builds slowly');
  if(l.earn!==1)a.push('income x'+l.earn);
  if(l.heat)a.push((l.heat>0?'+':'')+l.heat+' heat/mo');
  if(l.cost)a.push('costs $'+l.cost+'/mo');
  if(l.skim)a.push('keeps '+Math.round(l.skim*100)+'% for himself');
  return a.join(' · ');
}
function ltCard(k,pick){
  var l=S.L[k];
  return '<div class="card"><div class="nm">'+l.name+'</div><div class="tags"><span class="q">'+l.quality+'</span><span class="f">'+l.flaw+'</span></div><div class="plan">"'+l.plan+'"</div><div class="fx">'+fx(l)+'</div><div class="fx">Loyalty '+Math.round(l.loy)+'<div class="meter"><i style="width:'+Math.max(0,Math.min(100,l.loy))+'%"></i></div></div>'+(pick?'<button type="button" class="pick" data-pick="'+k+'">Appoint '+l.name+'</button>':'')+'</div>';
}
var assignCtx=null;
function askAssign(id,title,text,canSkip,onSkip){
  assignCtx={id:id,onSkip:onSkip};
  var h='<h2 id="sh">'+title+'</h2><p>'+text+'</p>';
  if(!S.bench.length)h+='<p>Nobody is free. Move someone from another district first.</p>';
  h+=S.bench.map(function(k){return ltCard(k,true)}).join('');
  if(canSkip||!S.bench.length)h+='<button type="button" class="alt" data-skip="1">Leave it for now</button>';
  open(h);
}
function assign(id,k){
  var d=S.D[id],old=d.lt;
  S.bench=S.bench.filter(function(x){return x!==k});
  if(old){S.bench.push(old);S.L[old].loy-=15;say(S.L[old].name+' was pulled out of '+d.name+' and is not happy.')}
  d.lt=k;S.L[k].loy+=5;
  say(S.L[k].name+' now runs '+d.name+'.');
}
function showDistrict(id){
  var d=S.D[id],lv=['I','II','III'][Math.max(0,Math.min(2,Math.floor(d.level+1e-6)-1))];
  var h='<h2 id="sh">'+d.name+'</h2><div class="stat"><div>Your influence<b>'+Math.round(d.share)+'%</b></div><div>District level<b>'+lv+'</b></div><div>Last envelope<b>'+money(d.last)+'</b></div><div>Callahan presence<b>'+Math.round((d.rival||0)*100)+'%</b></div></div>';
  h+=d.lt?ltCard(d.lt,false):'<p>Nobody runs this district. Your influence fades a little every month.</p>';
  h+='<button type="button" class="go" data-change="'+id+'">'+(d.lt?'Change lieutenant':'Appoint a lieutenant')+'</button><button type="button" class="alt" data-close="1">Back to the map</button>';
  open(h);
}
function end(title,text,won){
  S.over=true;render();hud();
  open('<h2 id="sh">'+title+'</h2><p>'+text+'</p><p>This prototype stops after one year. The full game runs to the end of Prohibition in 1933.</p><button type="button" class="go" data-again="1">Play again</button>');
  S.paused=true;
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest?ev.target.closest('button'):null;if(!t)return;
  var a;
  if((a=t.getAttribute('data-speed'))!==null){S.speed=Number(a);hud();restart();return}
  if((a=t.getAttribute('data-dist'))){if(!S.over)showDistrict(a);return}
  if((a=t.getAttribute('data-opt'))!==null){var fn=handlers[Number(a)];handlers=[];if(fn)fn();close();return}
  if((a=t.getAttribute('data-pick'))){assign(assignCtx.id,a);assignCtx=null;close();return}
  if(t.getAttribute('data-skip')){var c=assignCtx;assignCtx=null;if(c&&c.onSkip)c.onSkip();close();return}
  if((a=t.getAttribute('data-change'))){askAssign(a,'Who runs '+S.D[a].name+'?','The one you replace goes back to the bench, and will remember it.',true);return}
  if(t.getAttribute('data-close')){close();return}
  if(t.getAttribute('data-again')){init();return}
});
var timer=null;
function restart(){clearInterval(timer);if(S.speed>0)timer=setInterval(step,S.speed===3?300:900)}
init();restart();
window.__ashport={state:function(){return S},step:step};
})();
</script>
</body>
</html>
